<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Carlos Orlando Meneses Corona - Data Analyst Jr, BI Analyst" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4E79"/>
      <stop offset="55%" stop-color="#255C93"/>
      <stop offset="100%" stop-color="#2E6CA4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6FB0E6"/>
      <stop offset="100%" stop-color="#2E6CA4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Subtle data-network motif (left) -->
  <g stroke="#FFFFFF" stroke-width="1.4" fill="#FFFFFF" opacity="0.14">
    <line x1="70" y1="70" x2="165" y2="115"/>
    <line x1="165" y1="115" x2="110" y2="200"/>
    <line x1="165" y1="115" x2="235" y2="65"/>
    <line x1="110" y1="200" x2="210" y2="235"/>
    <line x1="235" y1="65" x2="300" y2="140"/>
    <line x1="210" y1="235" x2="300" y2="140"/>
    <circle cx="70" cy="70" r="5"/>
    <circle cx="165" cy="115" r="7"/>
    <circle cx="110" cy="200" r="5"/>
    <circle cx="235" cy="65" r="5"/>
    <circle cx="210" cy="235" r="6"/>
    <circle cx="300" cy="140" r="5"/>
  </g>

  <!-- Subtle data-network motif (right) -->
  <g stroke="#FFFFFF" stroke-width="1.4" fill="#FFFFFF" opacity="0.14">
    <line x1="1130" y1="70" x2="1035" y2="115"/>
    <line x1="1035" y1="115" x2="1090" y2="205"/>
    <line x1="1035" y1="115" x2="965" y2="65"/>
    <line x1="1090" y1="205" x2="990" y2="235"/>
    <line x1="965" y1="65" x2="900" y2="145"/>
    <line x1="990" y1="235" x2="900" y2="145"/>
    <circle cx="1130" cy="70" r="5"/>
    <circle cx="1035" cy="115" r="7"/>
    <circle cx="1090" cy="205" r="5"/>
    <circle cx="965" cy="65" r="5"/>
    <circle cx="990" cy="235" r="6"/>
    <circle cx="900" cy="145" r="5"/>
  </g>

  <!-- Name -->
  <text x="600" y="138" text-anchor="middle"
        font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif"
        font-size="50" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Carlos Orlando Meneses Corona</text>

  <!-- Accent underline -->
  <rect x="510" y="162" width="180" height="4" rx="2" fill="url(#accent)"/>

  <!-- Subtitle line 1: role -->
  <text x="600" y="206" text-anchor="middle"
        font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif"
        font-size="24" font-weight="700" fill="#EAF2FB" letter-spacing="0.8">Data Analyst Jr  ·  BI Analyst</text>

  <!-- Subtitle line 2: skills -->
  <text x="600" y="242" text-anchor="middle"
        font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif"
        font-size="21" font-weight="400" fill="#AFCDEA" letter-spacing="1.2">SQL  ·  Python  ·  Power BI  ·  Tableau</text>
</svg>
